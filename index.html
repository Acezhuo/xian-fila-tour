<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>西北FILA 巡店看板-测试</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }

    /* ===== Header ===== */
    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 48px 24px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.03) 0%, transparent 60%);
      pointer-events: none;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #e63946, #f4a261, #e63946);
    }
    .header-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .header-brand .logo-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: #e63946;
      color: #fff;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      border-radius: 4px;
      font-style: italic;
    }
    .header-brand .brand-name {
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 6px;
    }
    .header-title {
      font-size: 20px;
      font-weight: 300;
      color: rgba(255,255,255,0.85);
      letter-spacing: 4px;
      margin-bottom: 16px;
    }
    .header-stats {
      display: inline-flex;
      align-items: center;
      gap: 24px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 100px;
      padding: 8px 28px;
      margin-top: 8px;
    }
    .header-stats .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.9);
      font-size: 14px;
      font-weight: 400;
    }
    .header-stats .stat-item .num {
      font-size: 22px;
      font-weight: 700;
      color: #f4a261;
    }
    .header-stats .divider {
      width: 1px;
      height: 20px;
      background: rgba(255,255,255,0.15);
    }

    /* ===== Confidential Notice ===== */
    .confidential {
      text-align: center;
      padding: 12px 16px;
      background: #fff8e1;
      border-bottom: 1px solid #ffe082;
      font-size: 13px;
      color: #bf8f00;
      letter-spacing: 1px;
    }
    .confidential i {
      margin-right: 6px;
    }

    /* ===== Main Content ===== */
    .main-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 36px 20px 60px;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .section-label .bar {
      width: 4px;
      height: 22px;
      background: #e63946;
      border-radius: 2px;
    }
    .section-label h2 {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a2e;
      letter-spacing: 2px;
    }

    /* =====商圈卡片 ===== */
    .district-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      margin-bottom: 24px;
      transition: box-shadow 0.3s;
    }
    .district-card:hover {
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }

    .district-header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
    }
    .district-header:hover {
      background: #fafafa;
    }
    .district-header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .district-header-left .icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
      flex-shrink: 0;
    }
    .icon-wrap.red {
      background: linear-gradient(135deg, #e63946, #c1121f);
    }
    .icon-wrap.blue {
      background: linear-gradient(135deg, #457b9d, #1d3557);
    }
    .district-header-left .name {
      font-size: 17px;
      font-weight: 600;
      color: #1a1a2e;
    }
    .district-header-left .count {
      font-size: 13px;
      color: #888;
      margin-left: 4px;
    }
    .district-header .toggle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 12px;
      transition: transform 0.3s;
    }
    .district-header .toggle.rotated {
      transform: rotate(180deg);
    }

    .store-list {
      padding: 16px 24px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    /* ===== 门店卡片 ===== */
    .store-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: #f8f9fa;
      border-radius: 12px;
      border: 1px solid #eee;
      transition: all 0.25s;
    }
    .store-card:hover {
      border-color: #e63946;
      background: #fff5f5;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(230,57,70,0.1);
    }
    .store-card .store-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #e63946, #f4a261);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      flex-shrink: 0;
    }
    .store-card .store-icon.kids {
      background: linear-gradient(135deg, #457b9d, #1d3557);
    }
    .store-card .store-icon.fusion {
      background: linear-gradient(135deg, #e63946, #c1121f);
    }
    .store-card .store-info {
      flex: 1;
      min-width: 0;
    }
    .store-card .store-info .store-name {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 4px;
    }
    .store-card .store-info .store-type {
      font-size: 12px;
      color: #888;
      letter-spacing: 0.5px;
    }
    .store-card .store-info .store-type .badge {
      display: inline-block;
      padding: 2px 10px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 100px;
      font-size: 11px;
      color: #666;
    }
    .store-card .store-action {
      color: #ccc;
      font-size: 14px;
      transition: color 0.2s;
    }
    .store-card:hover .store-action {
      color: #e63946;
    }

    /* ===== Footer ===== */
    .footer {
      text-align: center;
      padding: 24px 16px 32px;
      color: #aaa;
      font-size: 12px;
      letter-spacing: 1px;
      border-top: 1px solid #eee;
      margin-top: 12px;
    }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      .header { padding: 32px 16px 28px; }
      .header-brand .logo-letter { width: 40px; height: 40px; font-size: 22px; }
      .header-brand .brand-name { font-size: 24px; letter-spacing: 4px; }
      .header-title { font-size: 16px; letter-spacing: 2px; }
      .header-stats { padding: 6px 16px; gap: 12px; flex-wrap: wrap; justify-content: center; }
      .header-stats .stat-item { font-size: 12px; }
      .header-stats .stat-item .num { font-size: 18px; }
      .main-content { padding: 24px 14px 40px; }
      .store-list { grid-template-columns: 1fr; }
      .district-header { padding: 16px 18px; }
      .store-list { padding: 12px 18px 16px; }
    }
  </style>
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header class="header">
    <div class="header-brand">
      <span class="logo-letter">F</span>
      <span class="brand-name">FILA</span>
    </div>
    <div class="header-title">西北FILA 巡店看板-测试</div>
    <div class="header-stats">
      <span class="stat-item">
        <i class="fa-regular fa-building" style="color:#f4a261"></i>
        <span><span class="num">2</span> 大商圈</span>
      </span>
      <span class="divider"></span>
      <span class="stat-item">
        <i class="fa-regular fa-store" style="color:#f4a261"></i>
        <span><span class="num">5</span> 家门店</span>
      </span>
    </div>
  </header>

  <!-- ==================== CONFIDENTIAL ==================== -->
  <div class="confidential">
    <i class="fa-regular fa-lock"></i>
    内部资料，仅供巡店参考，请勿外传或截图，谢谢配合
  </div>

  <!-- ==================== MAIN CONTENT ==================== -->
  <div class="main-content">

    <div class="section-label">
      <span class="bar"></span>
      <h2>选择门店</h2>
    </div>

    <!-- ===== 小寨商圈 ===== -->
    <div class="district-card">
      <div class="district-header" onclick="toggleDistrict(this)">
        <div class="district-header-left">
          <div class="icon-wrap red">
            <i class="fa-regular fa-location-dot"></i>
          </div>
          <div>
            <span class="name">小寨商圈</span>
            <span class="count">2 家门店</span>
          </div>
        </div>
        <div class="toggle rotated">
          <i class="fa-solid fa-chevron-down"></i>
        </div>
      </div>
      <div class="store-list">
        <div class="store-card">
          <div class="store-icon">
            <i class="fa-regular fa-store"></i>
          </div>
          <div class="store-info">
            <div class="store-name">西安壹号店</div>
            <div class="store-type">
              <span class="badge">店型A</span>
            </div>
          </div>
          <div class="store-action">
            <i class="fa-regular fa-arrow-right"></i>
          </div>
        </div>

        <div class="store-card">
          <div class="store-icon kids">
            <i class="fa-regular fa-child"></i>
          </div>
          <div class="store-info">
            <div class="store-name">西安赛格kids店</div>
            <div class="store-type">
              <span class="badge">店型B</span>
            </div>
          </div>
          <div class="store-action">
            <i class="fa-regular fa-arrow-right"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== 南门商圈 ===== -->
    <div class="district-card">
      <div class="district-header" onclick="toggleDistrict(this)">
        <div class="district-header-left">
          <div class="icon-wrap blue">
            <i class="fa-regular fa-location-dot"></i>
          </div>
          <div>
            <span class="name">南门商圈</span>
            <span class="count">3 家门店</span>
          </div>
        </div>
        <div class="toggle rotated">
          <i class="fa-solid fa-chevron-down"></i>
        </div>
      </div>
      <div class="store-list">
        <div class="store-card">
          <div class="store-icon">
            <i class="fa-regular fa-store"></i>
          </div>
          <div class="store-info">
            <div class="store-name">西安南门王府井</div>
            <div class="store-type">
              <span class="badge">店型C</span>
            </div>
          </div>
          <div class="store-action">
            <i class="fa-regular fa-arrow-right"></i>
          </div>
        </div>

        <div class="store-card">
          <div class="store-icon kids">
            <i class="fa-regular fa-child"></i>
          </div>
          <div class="store-info">
            <div class="store-name">西安skp kids店</div>
            <div class="store-type">
              <span class="badge">店型B</span>
            </div>
          </div>
          <div class="store-action">
            <i class="fa-regular fa-arrow-right"></i>
          </div>
        </div>

        <div class="store-card">
          <div class="store-icon">
            <i class="fa-regular fa-store"></i>
          </div>
          <div class="store-info">
            <div class="store-name">西安南门王府井</div>
            <div class="store-type">
              <span class="badge">店型D</span>
            </div>
          </div>
          <div class="store-action">
            <i class="fa-regular fa-arrow-right"></i>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- ==================== FOOTER ==================== -->
  <div class="footer">
    FILA 2026 · 内部巡店系统 · 数据仅供内部参考
  </div>

  <script>
    function toggleDistrict(el) {
      const list = el.nextElementSibling;
      const toggle = el.querySelector('.toggle');
      if (list.style.display === 'none') {
        list.style.display = 'grid';
        toggle.classList.add('rotated');
      } else {
        list.style.display = 'none';
        toggle.classList.remove('rotated');
      }
    }

    // 默认全部展开
    document.querySelectorAll('.store-list').forEach(el => el.style.display = 'grid');
  </script>
</body>
</html>
